# Matugen-generated colors (borders, root, window states)
source=~/.config/mango/colors.conf

layer_animation_type_open=zoom
layer_animation_type_close=zoom

# KEYBOARD ACCESSIBILITY
# ------------------------------------------------------------------------------
repeat_rate=40          # Key repetition speed (characters per second). Values: 1-100+
repeat_delay=200        # Delay before repetition starts (in milliseconds). Values: 100-2000

# WINDOW DECORATIONS & BORDERS
# ------------------------------------------------------------------------------
borderpx=1              # Border thickness (in pixels). Values: 0+
border_radius=0         # Corner rounding radius (in pixels). Values: 0+

shadows=1               # Window drop shadows. Values: 1 (enabled), 0 (disabled)
layer_shadows=1         # Shadows on layer surfaces/panels. Values: 1 (enabled), 0 (disabled)
shadow_only_floating=1  # Only render shadows on floating windows. Values: 1 (enabled), 0 (disabled)

# BACKGROUND BLUR EFFECTS
# ------------------------------------------------------------------------------
blur=1                  # Toggle background blur. Values: 1 (enabled), 0 (disabled)
blur_layer=1           # Enable blur on layer surfaces (e.g., bars/menus). Values: 1, 0
blur_optimized=1         # Enable rendering optimizations for blur. Values: 1, 0
blur_params_num_passes=3 # Number of blur passes (higher = smoother, heavier). Values: 1-5
blur_params_radius=8    # Blur strength/radius. Values: 1-20
blur_params_noise=0.02  # Noise intensity overlay. Values: 0.0 to 1.0
blur_params_brightness=1.5 # Target brightness. Values: 0.0 to 2.0
blur_params_contrast=0.9   # Target contrast. Values: 0.0 to 2.0
blur_params_saturation=1.2 # Target saturation. Values: 0.0 to 2.0

# MOUSE & TRACKPAD SCROLLING
# ------------------------------------------------------------------------------
mouse_natural_scrolling=0     # Mouse wheel direction. Values: 0 (normal), 1 (inverted)
trackpad_natural_scrolling=1  # Trackpad scroll direction. Values: 0 (normal), 1 (inverted)
# trackpad_scroll_factor=0.6

swipe_min_threshold=1

# 3-finger: Window focus
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggle_scratchpad

# 4-finger: Workspace navigation
# gesturebind=none,left,4,viewtoleft_have_client
# gesturebind=none,right,4,viewtoright_have_client
# gesturebind=none,up,4,toggleoverview
# gesturebind=none,down,4,toggleoverview

# ==============================================================================
# SYSTEM AUTOSTART & MONITORS
# ==============================================================================
# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once = mako
exec-once = waybar
exec-once = awww-daemon
exec-once = systemctl --user start mango-session.target
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
# exec-once = /usr/lib/xdg-desktop-portal-wlr &

monitorrule=name:eDP-1,scale:2

# Advanced Shadow Parameters
shadows_size = 5
shadows_blur = 30
shadows_position_x = 0
shadows_position_y = 0

no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0
zoom_end_ratio=0.0
fadein_begin_opacity=0
fadeout_begin_opacity=1
animation_duration_move=500
animation_duration_open=300
animation_duration_close=200
animation_duration_tag=350
animation_duration_focus=200
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Layout Settings
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

new_is_master=0
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_tab_mode_launch_next=0
overviewgappi=5
overviewgappo=30

# Misc Settings
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

numlockon=0
xkb_rules_layout=it

disable_trackpad=0
tap_to_click=1
tap_and_drag=0
drag_lock=1

# disable_while_typing=1
# left_handed=0
# middle_button_emulation=0
swipe_min_threshold=1

# Additional Colors
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ==============================================================================
# KEY BINDINGS
# ==============================================================================

# System Binds
bind=SUPER,r,reload_config
# bind=SUPER,space,spawn,fuzzel
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,t,spawn,kitty --single-instance
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER,e,spawn,nemo

# Workspace Overview
bind=SUPER,Tab,toggleoverview

# Focus Window (Directional)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Switch Workspace (Tag) X
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move Window to Workspace (Tag) X
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Swap Window Positions
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Window States
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# Scroller & Dwindle Controls
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down
bind=alt+shift,Return,dwindle_toggle_split_direction
bind=SUPER,n,switch_layout

# Relative Workspace Navigation
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# Monitor Controls
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# Gap Adjustments
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Manual Window Resizing & Moving
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Volume control (via WirePlumber / PipeWire)
# bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
# bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
# bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 5 --unmute
bindl=NONE,XF86AudioLowerVolume,spawn,pamixer -d 5
bindl=NONE,XF86AudioMute,spawn,pamixer --toggle-mute

# Display brightness (via brightnessctl)
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Media playback (via playerctl)
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# ==============================================================================
# MOUSE & AXIS BINDINGS
# ==============================================================================

# Mouse Window Actions
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+ALT,btn_left,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis Binds
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Layer Animation Rules
# layerrule=animation_type_open:fade,layer_name:rofi
# layerrule=animation_type_close:fade,layer_name:rofi
#
# layerrule=animation_type_open:zoom,layer_name:fuzzel
# layerrule=animation_type_close:zoom,layer_name:fuzzel

# animation_type_open=slide
# animation_type_open=zoom
# animation_type_close=zoom
#
# animation_duration_open=200
# animation_duration_close=200

# Match Kitty by appid and set focused/unfocused opacity (values between 0.0 and 1.0)
windowrule=appid:kitty,focused_opacity:0.8,unfocused_opacity:0.8
windowrule=appid:waybar,focused_opacity:0.8,unfocused_opacity:0.8

layerrule=noanim:1,noblur:1,layer_name:selection


# windowrule=appid:helium,focused_opacity:0.8,unfocused_opacity:0.8
# windowrule=appid:helium,trackpad_scroll_factor=0.1

windowrule=appid:bluetui,animation_type_open:zoom,animation_type_close:zoom, isoverlay:1,isfloating:1,width:0.7,height:0.6
windowrule=appid:impala,animation_type_open:zoom,animation_type_close:zoom,isoverlay:1,isfloating:1,width:0.7,height:0.6
windowrule=appid:btop,animation_type_open:zoom,animation_type_close:zoom,isoverlay:1,isfloating:1,width:0.7,height:0.6

layerrule=animation_type_open:fade,animation_type_close:fade,layer_name:notifications
# bind=SUPER+SHIFT,XF86Serach,spawn,hyprshot -m region -o "$HOME/Pictures/screenshots"
binds=NONE,F4,spawn,hyprshot -m region -o "$HOME/Pictures/screenshots"
# trackpad_scroll_factor=0.1

# trackpad_scroll_factor=0.6

