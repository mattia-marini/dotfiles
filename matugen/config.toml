[templates.mako]
input_path = "./templates/mako.conf"
output_path = "~/.cache/matugen_outputs/mako.conf"
post_hook = "makoctl reload"

[templates.hyprland-colors]
input_path = "./templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload || true"




