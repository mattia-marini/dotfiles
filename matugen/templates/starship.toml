add_newline = false

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[]({{ colors.primary.default.hex }})\\
$os\\
$username\\
[](bg:{{ colors.secondary.default.hex }} fg:{{ colors.primary.default.hex }})\\
$directory\\
[](fg:{{ colors.secondary.default.hex }} bg:{{ colors.tertiary.default.hex }})\\
$git_branch\\
$git_status\\
[](fg:{{ colors.tertiary.default.hex }} bg:{{ colors.surface_bright.default.hex }})\\
$time\\
[ ](fg:{{ colors.surface_bright.default.hex }})\\
$character"""

# $c\\
# $cpp\\
# $rust\\
# $golang\\
# $nodejs\\
# $php\\
# $java\\
# $kotlin\\
# $haskell\\
# $python\\
# [](fg:{{ colors.surface.default.hex }} bg:{{ colors.surface_container.default.hex }})\\
# $docker_context\\
# $conda\\
# $pixi\\
# [](fg:{{ colors.surface_container.default.hex }} bg:{{ colors.surface_bright.default.hex }})\\

[os]
disabled = false
style = "bg:{{ colors.primary.default.hex }} fg:{{ colors.on_primary.default.hex }}"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:{{ colors.primary.default.hex }} fg:{{ colors.on_primary.default.hex }}"
style_root = "bg:{{ colors.primary.default.hex }} fg:{{ colors.on_primary.default.hex }}"
format = '[ $user ]($style)'

[directory]
style = "fg:{{ colors.on_secondary.default.hex }} bg:{{ colors.secondary.default.hex }}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:{{ colors.tertiary.default.hex }}"
format = '[[ $symbol $branch ](fg:{{ colors.on_tertiary.default.hex }} bg:{{ colors.tertiary.default.hex }})]($style)'

[git_status]
style = "bg:{{ colors.tertiary.default.hex }}"
format = '[[($all_status$ahead_behind )](fg:{{ colors.on_tertiary.default.hex }} bg:{{ colors.tertiary.default.hex }})]($style)'

[nodejs]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[c]
symbol = " "
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[cpp]
symbol = " "
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[rust]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[golang]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[php]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[java]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[kotlin]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[haskell]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[python]
symbol = ""
style = "bg:{{ colors.surface.default.hex }}"
format = '[[ $symbol( $version) ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface.default.hex }})]($style)'

[docker_context]
symbol = ""
style = "bg:{{ colors.surface_container.default.hex }}"
format = '[[ $symbol( $context) ](fg:{{ colors.on_surface_variant.default.hex }} bg:{{ colors.surface_container.default.hex }})]($style)'

[conda]
style = "bg:{{ colors.surface_container.default.hex }}"
format = '[[ $symbol( $environment) ](fg:{{ colors.on_surface_variant.default.hex }} bg:{{ colors.surface_container.default.hex }})]($style)'

[pixi]
style = "bg:{{ colors.surface_container.default.hex }}"
format = '[[ $symbol( $version)( $environment) ](fg:{{ colors.on_surface_variant.default.hex }} bg:{{ colors.surface_container.default.hex }})]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:{{ colors.surface_bright.default.hex }}"
format = '[[  $time ](fg:{{ colors.on_surface.default.hex }} bg:{{ colors.surface_bright.default.hex }})]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:{{ colors.primary.default.hex }})'
error_symbol = '[](bold fg:{{ colors.error.default.hex }})'
vimcmd_symbol = '[](bold fg:{{ colors.primary.default.hex }})'
vimcmd_replace_one_symbol = '[](bold fg:{{ colors.tertiary.default.hex }})'
vimcmd_replace_symbol = '[](bold fg:{{ colors.tertiary.default.hex }})'
vimcmd_visual_symbol = '[](bold fg:{{ colors.secondary.default.hex }})'
