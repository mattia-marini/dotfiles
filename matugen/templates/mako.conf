font={{custom.font.family}} {{custom.font.size_small}}

# Matugen-generated colors (Format: #RRGGBBAA)
background-color=#{{ colors.surface.default.hex_alpha_stripped | set_alpha: 0.7 }}
text-color=#{{ colors.on_surface.default.hex_alpha_stripped }}
border-color=#{{ colors.primary.default.hex_alpha_stripped }}
progress-color=#{{ colors.primary.default.hex_alpha_stripped }}

# Mako only accepts integers, so thickness uses the unscaled base value and
# the radius uses the scaled value (8 * 1.5 = 12).
border-size={{ custom.border_thickness }}
border-radius={{ {{ custom.border_radius }} * {{ custom.scaling }} }}
